<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Configuración - Smart Room</title>
    <link rel="stylesheet" href="css/iroom.css">
</head>
<body>
    <main>

        <header>
            <h1>Configuración de la Smart Room</h1>
        </header>

        <form>

        <div class="columna-izquierda">

            <label for="pais">País:</label>
            <input type="text" id="pais" name="pais" list="paises">

            <datalist id="paises">
                <option value="España">
                <option value="Francia">
                <option value="Italia">
                <option value="Portugal">
                <option value="Alemania">
            </datalist>

            <label for="ciudad">Ciudad:</label>
            <input type="text" id="ciudad" name="ciudad">

            <label for="localizacion">Localización:</label>
            <input type="text" id="localizacion" name="localizacion">

            <label for="mapa">Enlace a Google Maps:</label>
            <input type="url" id="mapa" name="mapa">

            <label for="foto">Fotografía de la habitación:</label>
            <input type="file" id="foto" name="foto">

            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password">

        </div>

            <div class="columna-derecha">

            <fieldset>
                <legend>Sensores disponibles</legend>

                <input type="checkbox" id="temperatura" name="sensores" value="temperatura">
                <label for="temperatura">Temperatura</label>

                <input type="checkbox" id="humedad" name="sensores" value="humedad">
                <label for="humedad">Humedad</label>

                <input type="checkbox" id="sonido" name="sensores" value="sonido">
                <label for="sonido">Nivel de sonido</label>

                <input type="checkbox" id="luz" name="sensores" value="luz">
                <label for="luz">Nivel de luz</label>

                <input type="checkbox" id="movimiento" name="sensores" value="movimiento">
                <label for="movimiento">Movimiento</label>
            </fieldset>

            <label for="tempMax">Temperatura máxima:</label>
            <input type="number" id="tempMax" name="tempMax" min="-20" max="45" step="1">

            <label for="tempMin">Temperatura mínima:</label>
            <input type="number" id="tempMin" name="tempMin" min="-20" max="45" step="1">

            <label for="diferencia">Diferencia de temperatura:</label>
            <output id="diferencia" name="diferencia"></output>

            <button type="submit">Guardar configuración</button>
            </div>
        </form>

        <a href="index.html">Volver a la página principal</a>
    </main>

    <script src="datos.js"></script>

    <script>
        const tempMax = document.getElementById("tempMax");
        const tempMin = document.getElementById("tempMin");
        const diferencia = document.getElementById("diferencia");

        function calcularDiferencia() {
            const maxima = Number(tempMax.value);
            const minima = Number(tempMin.value);

            if (tempMax.value === "" || tempMin.value === "") {
                diferencia.value = "";
                tempMax.setCustomValidity("");

            } else if (maxima < minima) {
                diferencia.value = "La temperatura máxima debe ser mayor o igual que la mínima";
                tempMax.setCustomValidity(
                    "La temperatura máxima debe ser mayor o igual que la mínima"
                );

            } else {
                diferencia.value = maxima - minima;
                tempMax.setCustomValidity("");
            }
        }

        tempMax.addEventListener("input", calcularDiferencia);
        tempMin.addEventListener("input", calcularDiferencia);
    </script>
</body>
</html>
