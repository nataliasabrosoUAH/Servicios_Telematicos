<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería - Smart Room</title>
    <link rel="stylesheet" href="css/iroom.css">
    <link rel="stylesheet" href="css/galeria.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>

<body>
<main>
    <header>
        <h1>Galería de Imágenes</h1>
    </header>

    <nav>
        <a href="index.html">Inicio</a>
        <a href="config.html">Configuración</a>
        <a href="minombre.html">Nombre</a>
        <a href="calculadora.html">Calculadora</a>
        <a href="galeria.html">Galería</a>
    </nav>

    <section class="seccion-galeria">
        <h2>Alrededores de las estaciones meteorológicas</h2>
        <div class="carrusel">
            <button type="button" class="flecha" id="flechaIzquierda" aria-label="Imágenes anteriores">‹</button>
            <div class="ventana">
        <!-- Aquí las imágenes -->
         <div class="tira-imagenes">
            <figure class="foto" data-nombre="Alcalá de Henares">
                <img src="images/galeria/alcala.jpg" alt="Plaza de Cervantes en Alcalá de Henares">
            </figure>
            <figure class="foto" data-nombre="Madrid">
                <img src="images/galeria/madrid.jpg" alt="Vista de Madrid">
            </figure>
            <figure class="foto" data-nombre="Guadalajara">
                <img src="images/galeria/guadalajara.jpg" alt="Campos de lavanda en Guadalajara">
            </figure>
            <figure class="foto" data-nombre="Barcelona">
                <img src="images/galeria/barcelona.jpg" alt="Vista aérea de Barcelona">
            </figure>
            <figure class="foto" data-nombre="Valencia">
                <img src="images/galeria/valencia.jpg" alt="Ciudad de las Artes y las Ciencias de Valencia">
            </figure>
            <figure class="foto" data-nombre="Sevilla">
                <img src="images/galeria/sevilla.jpg" alt="Plaza de España de Sevilla">
            </figure>
            <figure class="foto" data-nombre="Granada">
                <img src="images/galeria/granada.jpg" alt="La Alhambra de Granada">
            </figure>
            <figure class="foto" data-nombre="Málaga">
                <img src="images/galeria/malaga.jpg" alt="Vista de Málaga">
            </figure>
            <figure class="foto" data-nombre="Cádiz">
                <img src="images/galeria/cadiz.jpg" alt="Playa de la Caleta en Cádiz">
            </figure>
            <figure class="foto" data-nombre="Santander">
                <img src="images/galeria/santander.jpg" alt="Costa de Cantabria">
            </figure>
        </div>
            </div>
            <button type="button" class="flecha" id="flechaDerecha" aria-label="Imágenes siguientes">›</button>
        </div>
    </section>

    <a href="index.html">Volver a la página principal</a>
</main>
<div id="infoImagen">
    <img src="" alt="">
    <p></p>
</div>
<dialog id="visor">
    <button type="button" class="visor-cerrar" id="visorCerrar" aria-label="Cerrar">&times;</button>
    <button type="button" class="flecha" id="visorAnterior" aria-label="Foto anterior">&lsaquo;</button>
    <figure>
        <img id="visorImagen" src="" alt="">
        <figcaption id="visorNombre"></figcaption>
    </figure>
    <button type="button" class="flecha" id="visorSiguiente" aria-label="Foto siguiente">&rsaquo;</button>
</dialog>
<script>
    $(document).ready(function () {

        // Al entrar y al salir con el ratón de una foto
        $(".foto").hover(
            function () {
                const nombre = $(this).data("nombre");
                const ruta = $(this).find("img").attr("src");

                $("#infoImagen img").attr("src", ruta).attr("alt", nombre);
                $("#infoImagen p").text(nombre);
                $("#infoImagen").stop(true, true).fadeIn(200);
            },
            function () {
                $("#infoImagen").stop(true, true).fadeOut(150);
            }
        );

        // El recuadro sigue al ratón
        $(".foto").mousemove(function (evento) {
            let x = evento.pageX + 20;
            const y = evento.pageY + 20;

            // Si se sale por la derecha, se pone a la izquierda del ratón
            if (x + 340 > $(window).width()) {
                x = evento.pageX - 360;
            }

            $("#infoImagen").css({ left: x, top: y });
        });   // ← cierra el mousemove

        // ----- Carrusel -----
        const paso = 215;   // ancho de una foto (200px) + separación (15px)
                // Lo máximo que se puede desplazar la tira hacia la derecha
        function desplazamientoMaximo() {
            const ventana = $(".ventana");
            return ventana[0].scrollWidth - ventana.innerWidth();
        }
                $("#flechaDerecha").click(function () {
            const ventana = $(".ventana");
            const posicion = ventana.scrollLeft();

            if (posicion >= desplazamientoMaximo() - 1) {
                // Está al final: vuelve al principio
                ventana.stop(true).animate({ scrollLeft: 0 }, 600);
            } else {
                ventana.stop(true).animate({ scrollLeft: "+=" + paso }, 400);
            }
        });

        $("#flechaIzquierda").click(function () {
            const ventana = $(".ventana");
            const posicion = ventana.scrollLeft();

            if (posicion <= 0) {
                // Está al principio: salta al final
                ventana.stop(true).animate({ scrollLeft: desplazamientoMaximo() }, 600);
            } else {
                ventana.stop(true).animate({ scrollLeft: "-=" + paso }, 400);
            }
        });

        // ----- Mejora: visor de fotos en grande -----
        const fotos = $(".foto");
        const visor = document.getElementById("visor");
        let fotoActual = 0;

        // Muestra en el visor la foto número "indice" (circular, como el carrusel)
        function mostrarFoto(indice) {
            fotoActual = (indice + fotos.length) % fotos.length;

            const foto = fotos.eq(fotoActual);
            const imagen = foto.find("img");

            $("#visorImagen").hide()
                .attr("src", imagen.attr("src"))
                .attr("alt", imagen.attr("alt"))
                .fadeIn(250);

            $("#visorNombre").text(
                foto.data("nombre") + " (" + (fotoActual + 1) + " de " + fotos.length + ")"
            );
        }

        // Al hacer clic en una foto, se abre el visor con esa foto
        fotos.click(function () {
            $("#infoImagen").hide();
            mostrarFoto(fotos.index(this));
            visor.showModal();
        });

        // Flechas del visor
        $("#visorAnterior").click(function () {
            mostrarFoto(fotoActual - 1);
        });

        $("#visorSiguiente").click(function () {
            mostrarFoto(fotoActual + 1);
        });

        // Botón de cerrar
        $("#visorCerrar").click(function () {
            visor.close();
        });

        // Teclado: flechas para cambiar de foto (Esc ya cierra el dialog solo)
        $(document).keydown(function (evento) {
            if (!visor.open) {
                return;
            }
            if (evento.key === "ArrowLeft") {
                mostrarFoto(fotoActual - 1);
            } else if (evento.key === "ArrowRight") {
                mostrarFoto(fotoActual + 1);
            }
        });

        // Clic fuera de la foto (en el fondo oscuro): se cierra
        $("#visor").click(function (evento) {
            if (evento.target === visor) {
                visor.close();
            }
        });
    });   // ← cierra el $(document).ready
</script>
</body>
</html>
