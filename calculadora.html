<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de temperaturas - Smart Room</title>
    <link rel="stylesheet" href="css/iroom.css">
</head>
<body>
  <main class="main-calculadora">
    <header>
    <h1>Calculadora de temperaturas</h1>
    </header>
    <section class="seccion-calculadora">
    <h2>Operaciones y conversiones</h2>

    <p class="etiqueta-display">Temperatura original</p>
    <p id="expresion" class="expresion-calculadora" aria-live="polite"></p>
    <div class="pantalla-calculadora">
        <input type="text" id="pantalla" value="0" readonly>
        <span id="unidadPantalla">°C</span>
    </div>

    <p class="etiqueta-display">Resultado de la conversión</p>
    <div class="pantalla-calculadora">
        <input type="text" id="pantallaResultado" value="0" readonly>
        <span id="unidadResultado">°C</span>
    </div>
    <p id="infoConfort" class="info-confort" aria-live="polite"></p>

<div class="botones-calculadora">
    <button type="button" class="numero">7</button>
    <button type="button" class="numero">8</button>
    <button type="button" class="numero">9</button>
    <button type="button" class="numero">4</button>
    <button type="button" class="numero">5</button>
    <button type="button" class="numero">6</button>
    <button type="button" class="numero">1</button>
    <button type="button" class="numero">2</button>
    <button type="button" class="numero">3</button>
    <button type="button" class="numero">0</button>
    <button type="button" id="borrar">C</button>
    <button type="button" id="retroceso" aria-label="Borrar último dígito">⌫</button>
    <button type="button" id="signo" aria-label="Cambiar signo">±</button>
    <button type="button" id="decimal">.</button>
    <button type="button" id="sumar">+</button>
    <button type="button" id="restar">-</button>
    <button type="button" id="multiplicar">×</button>
    <button type="button" id="dividir">÷</button>
    <button type="button" id="igual">=</button>
</div>
<div class="conversion-temperatura">

    <div class="campo-temperatura">
        <label for="unidad">Unidad de temperatura:</label>
        <select id="unidad">
            <option value="C">Celsius (°C)</option>
            <option value="K">Kelvin (K)</option>
            <option value="F">Fahrenheit (°F)</option>
        </select>
    </div>

    <div class="campo-temperatura">
        <label for="unidadDestino">Convertir a:</label>
        <select id="unidadDestino">
            <option value="C">Celsius (°C)</option>
            <option value="K">Kelvin (K)</option>
            <option value="F">Fahrenheit (°F)</option>
        </select>
    </div>

</div>

<button type="button" id="convertir">Convertir</button>
<button type="button" id="intercambiar" aria-label="Intercambiar unidades">⇄</button>
<button type="button" id="usarResultado">Usar resultado</button>
<p>
    <a href="index.html">Volver a la página principal</a>
</p>
</section>

<section class="seccion-historial">
    <h2>Historial</h2>
    <ul id="historial"></ul>
    <button type="button" id="borrarHistorial">Borrar historial</button>
</section>

<dialog id="modalCalculadora">
    <h2>Aviso</h2>
    <p id="mensajeModal"></p>
    <button type="button" id="cerrarModal">Aceptar</button>
</dialog>
</main>
<script>
   const pantalla = document.getElementById("pantalla");
   const unidadPantalla = document.getElementById("unidadPantalla");
   const pantallaResultado = document.getElementById("pantallaResultado");
const unidadResultado = document.getElementById("unidadResultado");
const unidad = document.getElementById("unidad");
const botonesNumeros = document.querySelectorAll(".numero");
const botonBorrar = document.getElementById("borrar");
const botonDecimal = document.getElementById("decimal");
const botonSumar = document.getElementById("sumar");
const botonRestar = document.getElementById("restar");
const botonMultiplicar = document.getElementById("multiplicar");
const botonDividir = document.getElementById("dividir");
let primerNumero = 0;
let operacion = "";
const botonIgual = document.getElementById("igual");
const unidadDestino = document.getElementById("unidadDestino");
const botonConvertir = document.getElementById("convertir");
// ----- Elementos nuevos -----
const expresion = document.getElementById("expresion");
const infoConfort = document.getElementById("infoConfort");
const botonRetroceso = document.getElementById("retroceso");
const botonSigno = document.getElementById("signo");
const botonIntercambiar = document.getElementById("intercambiar");
const botonUsarResultado = document.getElementById("usarResultado");
const listaHistorial = document.getElementById("historial");
const botonBorrarHistorial = document.getElementById("borrarHistorial");
const modal = document.getElementById("modalCalculadora");
const mensajeModal = document.getElementById("mensajeModal");
const cerrarModal = document.getElementById("cerrarModal");

// true = el siguiente número que se escriba empieza de cero
let reiniciarPantalla = false;

// Símbolos para mostrar la operación y las unidades
const SIMBOLOS = { suma: "+", resta: "−", multiplicacion: "×", division: "÷" };
const UNIDADES = { C: "°C", K: "K", F: "°F" };

// Ventana modal (sustituye a alert)
function mostrarModal(mensaje) {
    mensajeModal.textContent = mensaje;
    modal.showModal();
}

cerrarModal.addEventListener("click", function() {
    modal.close();
});
// ----- Escribir números -----
function escribirDigito(numero) {
    if (reiniciarPantalla || pantalla.value === "0" || pantalla.value === "Error") {
        pantalla.value = numero;
        reiniciarPantalla = false;
    } else if (pantalla.value === "-0") {
        pantalla.value = "-" + numero;
    } else {
        pantalla.value += numero;
    }
}

botonesNumeros.forEach(function(boton) {
    boton.addEventListener("click", function() {
        escribirDigito(boton.textContent);
    });
});

// ----- Punto decimal -----
function escribirDecimal() {
    if (reiniciarPantalla || pantalla.value === "Error") {
        pantalla.value = "0.";
        reiniciarPantalla = false;
    } else if (!pantalla.value.includes(".")) {
        pantalla.value += ".";
    }
}
botonDecimal.addEventListener("click", escribirDecimal);

// ----- ± : cambiar signo (temperaturas negativas) -----
botonSigno.addEventListener("click", function() {
    if (pantalla.value === "Error") {
        return;
    }
    if (reiniciarPantalla) {
        pantalla.value = "-0";
        reiniciarPantalla = false;
    } else if (pantalla.value.startsWith("-")) {
        pantalla.value = pantalla.value.substring(1);
    } else {
        pantalla.value = "-" + pantalla.value;
    }
});

// ----- ⌫ : borrar el último dígito -----
function borrarUltimo() {
    if (reiniciarPantalla || pantalla.value === "Error") {
        return;
    }
    let texto = pantalla.value.slice(0, -1);
    if (texto === "" || texto === "-") {
        texto = "0";
    }
    pantalla.value = texto;
}
botonRetroceso.addEventListener("click", borrarUltimo);
// ----- C : borrar todo -----
function borrarTodo() {
    pantalla.value = "0";
    pantallaResultado.value = "0";
    unidadResultado.textContent = UNIDADES[unidadDestino.value];
    expresion.textContent = "";
    infoConfort.textContent = "";
    primerNumero = 0;
    operacion = "";
    reiniciarPantalla = false;
}
botonBorrar.addEventListener("click", borrarTodo);
// ----- Hacer la operación pendiente -----
// Devuelve true si ha ido bien
function calcular() {
    if (operacion === "") {
        return false;
    }
    const segundoNumero = Number(pantalla.value);
    let resultado;

    if (operacion === "suma") {
        resultado = primerNumero + segundoNumero;
    } else if (operacion === "resta") {
        resultado = primerNumero - segundoNumero;
    } else if (operacion === "multiplicacion") {
        resultado = primerNumero * segundoNumero;
    } else if (operacion === "division") {
        if (segundoNumero === 0) {
            pantalla.value = "Error";
            expresion.textContent = "";
            primerNumero = 0;
            operacion = "";
            reiniciarPantalla = true;
            mostrarModal("No se puede dividir entre 0.");
            return false;
        }
        resultado = primerNumero / segundoNumero;
    }

    resultado = Number(resultado.toFixed(2));
    expresion.textContent = primerNumero + " " + SIMBOLOS[operacion] + " " + segundoNumero + " =";
    agregarHistorial(primerNumero + " " + SIMBOLOS[operacion] + " " + segundoNumero +
        " = " + resultado + " " + unidadPantalla.textContent);

    pantalla.value = resultado;
    operacion = "";
    reiniciarPantalla = true;
    return true;
}

//  Pulsar + − × ÷ 
function elegirOperacion(nuevaOperacion) {
    if (pantalla.value === "Error") {
        return;
    }
    // Si ya había una operación y se ha escrito el 2º número, se calcula antes
    if (operacion !== "" && !reiniciarPantalla) {
        if (!calcular()) {
            return;
        }
    }
    primerNumero = Number(pantalla.value);
    operacion = nuevaOperacion;
    reiniciarPantalla = true;
    expresion.textContent = primerNumero + " " + SIMBOLOS[operacion];
}

botonSumar.addEventListener("click", function() { elegirOperacion("suma"); });
botonRestar.addEventListener("click", function() { elegirOperacion("resta"); });
botonMultiplicar.addEventListener("click", function() { elegirOperacion("multiplicacion"); });
botonDividir.addEventListener("click", function() { elegirOperacion("division"); });
botonIgual.addEventListener("click", calcular);

unidad.addEventListener("change", function() {
    if (unidad.value === "C") {
        unidadPantalla.textContent = "°C";
    } else if (unidad.value === "K") {
        unidadPantalla.textContent = "K";
    } else if (unidad.value === "F") {
        unidadPantalla.textContent = "°F";
    }
});
// ----- Conversión: origen → Kelvin → destino -----
function aKelvin(valor, unidadOrigen) {
    if (unidadOrigen === "C") {
        return valor + 273.15;
    } else if (unidadOrigen === "F") {
        return (valor - 32) / 1.8 + 273.15;
    }
    return valor;   // ya está en Kelvin
}

function desdeKelvin(kelvin, unidadFinal) {
    if (unidadFinal === "C") {
        return kelvin - 273.15;
    } else if (unidadFinal === "F") {
        return (kelvin - 273.15) * 1.8 + 32;
    }
    return kelvin;
}

// Indica si está en el intervalo de la Smart Room (22–26 °C)
function mostrarConfort(celsius) {
    if (celsius < 22) {
        infoConfort.textContent = "🔵 Por debajo del intervalo recomendado (22–26 °C)";
    } else if (celsius > 26) {
        infoConfort.textContent = "🔴 Por encima del intervalo recomendado (22–26 °C)";
    } else {
        infoConfort.textContent = "🟢 Dentro del intervalo recomendado (22–26 °C)";
    }
}

function convertir() {
    if (pantalla.value === "Error") {
        return;
    }
    const temperatura = Number(pantalla.value);
    const kelvin = aKelvin(temperatura, unidad.value);

    // Cero absoluto (0 K): no puede haber nada por debajo
    if (kelvin < -0.000001) {
        mostrarModal("Error: " + temperatura + " " + UNIDADES[unidad.value] +
            " es inferior al cero absoluto.");
        return;
    }

    const resultado = Number(desdeKelvin(kelvin, unidadDestino.value).toFixed(2));
    pantallaResultado.value = resultado;
    unidadResultado.textContent = UNIDADES[unidadDestino.value];
    mostrarConfort(kelvin - 273.15);

    if (unidad.value !== unidadDestino.value) {
        agregarHistorial(temperatura + " " + UNIDADES[unidad.value] + " → " +
            resultado + " " + UNIDADES[unidadDestino.value]);
    }
}

botonConvertir.addEventListener("click", convertir);
// ----- Al cambiar la unidad de destino se actualiza su símbolo -----
unidadDestino.addEventListener("change", function() {
    unidadResultado.textContent = UNIDADES[unidadDestino.value];
});

// ----- ⇄ : intercambiar unidades -----
botonIntercambiar.addEventListener("click", function() {
    const auxiliar = unidad.value;
    unidad.value = unidadDestino.value;
    unidadDestino.value = auxiliar;
    unidadPantalla.textContent = UNIDADES[unidad.value];
    unidadResultado.textContent = UNIDADES[unidadDestino.value];
});

// ----- Usar el resultado como temperatura original -----
botonUsarResultado.addEventListener("click", function() {
    pantalla.value = pantallaResultado.value;
    unidad.value = unidadDestino.value;
    unidadPantalla.textContent = UNIDADES[unidad.value];
    operacion = "";
    expresion.textContent = "";
    reiniciarPantalla = true;
});

// ----- Historial (guardado en localStorage, últimas 8 entradas) -----
function leerHistorial() {
    try {
        return JSON.parse(localStorage.getItem("historialCalculadora")) || [];
    } catch (error) {
        return [];
    }
}

function pintarHistorial() {
    const historial = leerHistorial();
    listaHistorial.innerHTML = "";
    if (historial.length === 0) {
        const vacio = document.createElement("li");
        vacio.textContent = "Todavía no hay operaciones.";
        listaHistorial.appendChild(vacio);
        return;
    }
    for (const entrada of historial) {
        const elemento = document.createElement("li");
        elemento.textContent = entrada;
        listaHistorial.appendChild(elemento);
    }
}

function agregarHistorial(texto) {
    const historial = leerHistorial();
    historial.unshift(texto);          // lo más reciente arriba
    if (historial.length > 8) {
        historial.length = 8;
    }
    localStorage.setItem("historialCalculadora", JSON.stringify(historial));
    pintarHistorial();
}

botonBorrarHistorial.addEventListener("click", function() {
    localStorage.removeItem("historialCalculadora");
    pintarHistorial();
});

// ----- Uso con el teclado -----
document.addEventListener("keydown", function(event) {
    const elemento = event.target.tagName;
    if (elemento === "SELECT" || modal.open) {
        return;
    }
    if (event.key === "Enter" && elemento === "BUTTON") {
        return;   // el navegador ya pulsa el botón
    }

    const tecla = event.key;
    if (tecla >= "0" && tecla <= "9") {
        escribirDigito(tecla);
    } else if (tecla === "." || tecla === ",") {
        escribirDecimal();
    } else if (tecla === "+") {
        elegirOperacion("suma");
    } else if (tecla === "-") {
        elegirOperacion("resta");
    } else if (tecla === "*") {
        elegirOperacion("multiplicacion");
    } else if (tecla === "/") {
        elegirOperacion("division");
    } else if (tecla === "Enter" || tecla === "=") {
        calcular();
    } else if (tecla === "Backspace") {
        borrarUltimo();
    } else if (tecla === "Escape") {
        borrarTodo();
    } else {
        return;
    }
    event.preventDefault();
});

// ----- Al cargar la página -----
pintarHistorial();
</script>
</body>
</html>
